title: bslee's blog
description: 게임과 서브컬처의 역사, 제작 배경, 잊힌 기록을 정리하는 개인 아카이브
author: bslee
email: bumdak@naver.com
baseurl: ""
url: "https://bslee-dev.github.io"

lang: ko
# 이 설정이 없으면 Jekyll이 UTC로 날짜를 계산해서
# 오전 9시 이전에 쓴 글의 URL 날짜가 하루 앞당겨진다.
timezone: Asia/Seoul

# /categories/ 페이지에 표시할 카테고리와 그 순서.
# 새 카테고리를 쓰게 되면 여기에도 추가한다.
category_list:
  - 게임역사
  - 게임뉴스
  - 캐릭터평전
  - 인물
  - 서브컬처

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
